name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'  # v1.0, v1.1 등 태그 푸시 시 실행
  workflow_dispatch:  # 수동 실행 가능

# 권한 설정 추가
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Get version from tag
      id: get_version
      shell: bash
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION=$(python -c "from version import __version__; print(__version__)")
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build EXE
      run: |
        pyinstaller --onefile --windowed --name "DataPreprocessor_${{ steps.get_version.outputs.VERSION }}" --icon=NONE gui_app.py
    
    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: DataPreprocessor-${{ steps.get_version.outputs.VERSION }}-Windows
        path: dist/DataPreprocessor_${{ steps.get_version.outputs.VERSION }}.exe
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/DataPreprocessor_${{ steps.get_version.outputs.VERSION }}.exe
        body: |
          ## 시계열 데이터 전처리 프로그램 ${{ steps.get_version.outputs.VERSION }}
          
          ### 다운로드
          - `DataPreprocessor_${{ steps.get_version.outputs.VERSION }}.exe` - Windows 실행 파일 (Python 설치 불필요)
          
          ### 주요 기능
          - 📁 Excel/CSV 파일 로드
          - 🔧 다중 조건 필터링 (AND)
          - 📊 이상값 처리 (2σ, 2.5σ, 3σ, IQR)
          - 📈 트렌드 차트 (다중 컬럼, 인터랙티브 커서)
          - 💾 프리셋 저장/불러오기
          - ⏳ 진행률 표시 (대용량 데이터 지원)
